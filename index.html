<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2313695f%27/%3E%3Cpath d=%27M8 16l5 5 11-11%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273%27/%3E%3C/svg%3E"><title>로봇 테스트베드 · 이슈 관리</title><link rel="stylesheet" href="styles.css"><script defer src="issue-core.js"></script><script defer src="sample-data.js"></script><script defer src="classroom-config.js"></script><script defer src="classroom.js"></script><script defer src="app.js"></script><link rel="stylesheet" href="classroom.css"></head>
<body><main><header><div><h1>로봇 테스트베드 이슈 관리</h1><p>작은 이슈도 놓치지 않도록, 진행 상황을 한곳에서 확인하세요.</p></div><button id="add" class="primary">+ 이슈 등록</button></header>
<aside class="notice">POC용 가상 데이터 — 실제 사업 현황 아님</aside>
<section id="summary" aria-label="전체 이슈 상태별 건수"></section>
<section class="board"><div class="toolbar"><div><h2>이슈 목록</h2><p id="visible-count"></p></div><div class="actions"><label for="filter">상태</label><select id="filter"><option>전체</option><option>접수</option><option>진행 중</option><option>완료</option></select><button id="export">CSV 내보내기</button></div></div>
<div class="table-wrap"><table><thead><tr><th>이슈 제목</th><th>담당자</th><th>목표일</th><th>우선순위</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>표시할 이슈가 없습니다.</p></section>
<p id="message" role="status" aria-live="polite"></p><footer>개인 모드는 이 브라우저에 저장됩니다. 공동 수업 모드는 로그인한 교육방에 저장됩니다.</footer></main>
<dialog id="editor"><form id="form" novalidate><h2 id="editor-title">이슈 등록</h2><label>이슈 제목<input name="title" maxlength="200" required></label><label>담당자<input name="owner" maxlength="80" required></label><label>목표일<input name="due" type="date" required></label><div class="form-grid"><label>우선순위<select name="priority"><option>보통</option><option>높음</option><option>낮음</option></select></label><label>상태<select name="status"><option>접수</option><option>진행 중</option><option>완료</option></select></label></div><p id="error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
</body></html>
